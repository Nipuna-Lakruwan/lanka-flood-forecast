name: Refresh forecast

# Pulls the latest river levels, forecasts every station and commits docs/forecast.json,
# which GitHub Pages serves as the live map.
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --no-dev
      - run: uv run python src/live.py forecast
      - name: Commit the new forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/forecast.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
